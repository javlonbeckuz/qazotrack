<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="A quiet, steady way to keep your qaza prayers visible and moving." />
    <link rel="icon" type="image/png" href="/qazotrack-logo.png" />
    <link rel="apple-touch-icon" href="/qazotrack-logo.png" />
    <title>QazoTrack — Steady progress</title>

    <!-- Umami. One of the two analytics scripts the site loads; the other is
         Simple Analytics, at the foot of the body. Both count page views
         without cookies and without an identifier that follows a reader
         between sites, which is what makes either tolerable on a page that is
         otherwise about somebody's prayer record. Two trackers is two
         third-party requests for one number — drop whichever is not being
         read.

         `defer` keeps it off the critical path — fetched while the document
         parses, run after it — so a slow or blocked analytics host cannot hold
         up the first paint. Nothing in the app reads it back, and it is a plain
         script tag rather than an import so it stays out of the bundle and can
         be removed by deleting these two lines.

         No `integrity` hash: Umami ships this file from its own CDN and updates
         it in place, so a pinned hash would silently stop the script the next
         time they release. Self-hosting the tracker is the way to get the hash
         back if that trade stops being acceptable. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="72ae2497-ce04-4f97-b20f-c3c98e4307e2"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Simple Analytics. At the foot of the body, where its own install
         instructions put it, and `async` so it never blocks the app script
         above it. See the note in the head for why there are two of these.

         The <noscript> pixel is how a reader with JavaScript off is counted at
         all. `referrerpolicy` is the vendor's own value: it sends the referring
         URL to their https endpoint but drops it on any downgrade to http. -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt="" referrerpolicy="no-referrer-when-downgrade" /></noscript>
  </body>
</html>

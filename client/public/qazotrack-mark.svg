<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QazoTrack">
  <!-- The eight-point spark the wordmark carries, on the ink the pill nav uses.
       Ink ground rather than a transparent mark: a browser tab may sit on light
       or dark chrome, and a white star alone would vanish on one of them. The
       same two values as the app, kept literal because an SVG file cannot read
       the stylesheet's tokens. -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <polygon fill="#ffffff" points="32,12 36.4,27.6 52,32 36.4,36.4 32,52 27.6,36.4 12,32 27.6,27.6"/>
</svg>
